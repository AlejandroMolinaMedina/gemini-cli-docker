name: Build and Push Docker Image

on:
  push:
    paths:
      - 'Dockerfile'
    branches:
      - master
permissions:
  contents: read
  packages: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Extract and format repository name
        run: |
          # Extrae solo "usuario/repositorio" eliminado prefijos SSH/HTTPS y sufijos .git
          CLEAN_REPO=$(echo "${GITHUB_REPOSITORY}" | sed -E 's/.*[:\/]([^\/]+\/[^\/]+)$/\1/' | sed 's/\.git$//' | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${CLEAN_REPO}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:latest